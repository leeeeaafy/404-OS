    <script>

  });

  const musicTracks = [
    { title: "Hidden", artist: "Hidden", src: "loss.wav" },

    { title: "Hidden", artist: "Hidden", src: "loss.wav" }
  ];

  const musicAudio = document.getElementById("musicAudio");

  const musicPrev = document.getElementById("musicPrev");

  const musicTrackList = document.getElementById("musicTrackList");

  let currentTrackIndex = 0;

  function formatTime(time) {
    if (!Number.isFinite(time) || time < 0) return "0:00";
    const minutes = Math.floor(time / 60);
    const seconds = Math.floor(time % 60);
    return `${minutes}:${String(seconds).padStart(2, "0")}`;
  }

  function renderTracks() {
    musicTrackList.innerHTML = "";
  }

  function loadTrack() {
    const track = musicTracks[currentTrackIndex];
    musicAudio.src = track.src;
    musicAudio.load();
    renderTracks();
  }

  function togglePlay() {
    if (musicAudio.paused) {
      musicAudio.play();
      musicPlay.textContent = "❚❚";
    } else {
      musicAudio.pause();
      musicPlay.textContent = "▶";
    }
  }

  function nextTrack() {
    currentTrackIndex = (currentTrackIndex + 1) % musicTracks.length;
    loadTrack();
    musicAudio.play();
    musicPlay.textContent = "❚❚";
  }

  function prevTrack() {
    currentTrackIndex = (currentTrackIndex - 1 + musicTracks.length) % musicTracks.length;
    loadTrack();
    musicAudio.play();
    musicPlay.textContent = "❚❚";
  }

  musicPlay.addEventListener("click", togglePlay);
  musicNext.addEventListener("click", nextTrack);
  musicPrev.addEventListener("click", prevTrack);

  musicAudio.addEventListener("loadedmetadata", () => {
    musicDuration.textContent = formatTime(musicAudio.duration);
    musicProgress.max = musicAudio.duration || 100;
  });

  musicAudio.addEventListener("timeupdate", () => {
    musicCurrentTime.textContent = formatTime(musicAudio.currentTime);
    musicProgress.value = musicAudio.currentTime;
  });

  musicAudio.addEventListener("ended", nextTrack);
  musicAudio.addEventListener("play", () => {
    musicPlay.textContent = "❚❚";
  });
  musicAudio.addEventListener("pause", () => {
    musicPlay.textContent = "▶";
  });

  musicProgress.addEventListener("input", () => {
    musicAudio.currentTime = Number(musicProgress.value);
  });

  musicVolume.addEventListener("input", () => {
    musicAudio.volume = Number(musicVolume.value);
  });

  musicAudio.volume = Number(musicVolume.value);
  loadTrack();

      const openGallery = document.getElementById("openGallery");
      const galleryWindow = document.getElementById("galleryWindow");
      const galleryCloseBtn = document.getElementById("galleryCloseBtn");
      const galleryMinimizeBtn = document.getElementById("galleryMinimizeBtn");

      openGallery.addEventListener("click", () => {
        galleryWindow.classList.add("show");
      });

      galleryCloseBtn.addEventListener("click", () => {
        galleryWindow.classList.remove("show");
      });

      galleryMinimizeBtn.addEventListener("click", () => {
        galleryWindow.classList.toggle("show");
      });

      let galleryDrag = false;
      let galleryDragOffsetX = 0;
      let galleryDragOffsetY = 0;

      galleryTitlebar.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".gallery-dot")) return;

        galleryDrag = true;
        const rect = galleryWindow.getBoundingClientRect();
        galleryDragOffsetX = e.clientX - rect.left;
        galleryDragOffsetY = e.clientY - rect.top;
        galleryTitlebar.setPointerCapture(e.pointerId);
      });

      galleryTitlebar.addEventListener("pointermove", (e) => {
        if (!galleryDrag) return;

        const x = e.clientX - galleryDragOffsetX;
        const y = e.clientY - galleryDragOffsetY;

        galleryWindow.style.left = `${x}px`;
        galleryWindow.style.top = `${y}px`;
        galleryWindow.style.transform = "none";
      });

      galleryTitlebar.addEventListener("pointerup", () => {
        galleryDrag = false;
      });

      galleryTitlebar.addEventListener("pointercancel", () => {
        galleryDrag = false;
      });

      const videoBox = document.getElementById("videoBox");
      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      videoBox.addEventListener("pointerdown", (e) => {
        isDragging = true;
        const rect = videoBox.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        videoBox.setPointerCapture(e.pointerId);
      });

      videoBox.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const x = e.clientX - offsetX;
        const y = e.clientY - offsetY;
        videoBox.style.left = `${x}px`;
        videoBox.style.top = `${y}px`;
      });

      videoBox.addEventListener("pointerup", () => {
        isDragging = false;
      });

      videoBox.addEventListener("pointerleave", () => {
        isDragging = false;
      });

      const box = document.getElementById("box");
      const grip = document.getElementById("grip");

      let x = 0, y = 0;
      let start = null;

      grip.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        grip.setPointerCapture(e.pointerId);
        start = {
          pointerX: e.clientX,
          pointerY: e.clientY,
          offsetX: x,
          offsetY: y
        };
      });

      grip.addEventListener("pointermove", (e) => {
        if (!start) return;
        x = start.offsetX + (e.clientX - start.pointerX);
        y = start.offsetY + (e.clientY - start.pointerY);
        box.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      });

      const stop = () => { start = null; };

      grip.addEventListener("pointerup", stop);
      grip.addEventListener("pointercancel", stop);

      const canvas = document.getElementById("drawCanvas");
      const ctx = canvas.getContext("2d");
      const colorPicker = document.getElementById("colorPicker");
      const brushSize = document.getElementById("brushSize");
      const clearBtn = document.getElementById("clearBtn");
      const undoBtn = document.getElementById("undoBtn");
      const eraserBtn = document.getElementById("eraserBtn");
      const saveBtn = document.getElementById("saveBtn");
      const drawWindow = document.getElementById("drawWindow");
      const openDraw = document.getElementById("openDraw");
      const closeBtn = document.getElementById("closeBtn");
      const minimizeBtn = document.getElementById("minimizeBtn");
      const drawTitlebar = document.getElementById("drawTitlebar");

      const history = [];
      let historyIndex = -1;
      let drawing = false;
      let usingEraser = false;
      let lastX = 0;
      let lastY = 0;
      let dragWindow = false;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      function saveState() {
        historyIndex++;
        if (historyIndex < history.length) { history.length = historyIndex; }
        history.push(canvas.toDataURL());
        if (history.length > 20) {
          history.shift();
          historyIndex--;
        }
      }

      function restoreState(index) {
        const img = new Image();
        img.src = history[index];
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
      }

      function getCanvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        return {
          x: (event.clientX - rect.left) * scaleX,
          y: (event.clientY - rect.top) * scaleY
        };
      }

      function startDrawing(event) {
        drawing = true;
        const { x, y } = getCanvasPoint(event);
        lastX = x;
        lastY = y;
        ctx.beginPath();
        ctx.moveTo(x, y);
      }

      function draw(event) {
        if (!drawing) return;
        const { x, y } = getCanvasPoint(event);

        ctx.lineWidth = Number(brushSize.value);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = usingEraser ? "#ffffff" : colorPicker.value;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x;
        lastY = y;
      }

      function stopDrawing() {
        if (!drawing) return;
        drawing = false;
        saveState();
      }

      canvas.addEventListener("pointerdown", startDrawing);
      canvas.addEventListener("pointermove", draw);
      canvas.addEventListener("pointerup", stopDrawing);
      canvas.addEventListener("pointerleave", stopDrawing);
      canvas.addEventListener("pointercancel", stopDrawing);

      clearBtn.addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveState();});

      undoBtn.addEventListener("click", () => {
        if (historyIndex > 0) {historyIndex--;
          restoreState(historyIndex);}});

      eraserBtn.addEventListener("click", () => {
        usingEraser = !usingEraser;
        eraserBtn.textContent = usingEraser ? "Brush" : "Eraser";});

      saveBtn.addEventListener("click", () => {
        const link = document.createElement("a");
        link.download = "drawing.png";
        link.href = canvas.toDataURL("image/png");
        link.click();});

      openDraw.addEventListener("click", () => {
        drawWindow.classList.add("show");});

      closeBtn.addEventListener("click", () => {
        drawWindow.classList.remove("show");});

      minimizeBtn.addEventListener("click", () => {
        drawWindow.classList.toggle("show");});

      drawTitlebar.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".draw-dot")) return;
        dragWindow = true;
        const rect = drawWindow.getBoundingClientRect();
        dragOffsetX = e.clientX - rect.left;
        dragOffsetY = e.clientY - rect.top;
        drawTitlebar.setPointerCapture(e.pointerId);});

      drawTitlebar.addEventListener("pointermove", (e) => {
        if (!dragWindow) return;

        const x = e.clientX - dragOffsetX;
        const y = e.clientY - dragOffsetY;
        drawWindow.style.left = `${x}px`;
        drawWindow.style.top = `${y}px`;
        drawWindow.style.transform = "none";
      });

      drawTitlebar.addEventListener("pointerup", () => {
        dragWindow = false;
      });

      drawTitlebar.addEventListener("pointercancel", () => {
        dragWindow = false;
      });

      function initCanvas() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        saveState();
      }

      initCanvas();

      const puzzleWindow = document.getElementById("puzzleWindow");
      const openPuzzleBtn = document.getElementById("openPuzzle");
      const puzzleCloseBtn = document.getElementById("puzzleCloseBtn");
      const puzzleMinimizeBtn = document.getElementById("puzzleMinimizeBtn");
      const puzzleTitlebar = document.getElementById("puzzleTitlebar");
      const puzzleUpload = document.getElementById("puzzleUpload");
      const puzzleBoard = document.getElementById("puzzleBoard");
      const shufflePuzzleBtn = document.getElementById("shufflePuzzleBtn");
      const resetPuzzleBtn = document.getElementById("resetPuzzleBtn");
      const puzzleStatus = document.getElementById("puzzleStatus");

      let puzzleRows = 3;
      let puzzleCols = 3;
      let currentImage = createDefaultPuzzleImage();
      let puzzlePieces = [];
      let draggedPiece = null;
      let puzzleDrag = false;
      let puzzleDragOffsetX = 0;
      let puzzleDragOffsetY = 0;

      function createDefaultPuzzleImage() {
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="700">
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#7dd3fc" />
                <stop offset="30%" stop-color="#a78bfa" />
                <stop offset="70%" stop-color="#f9a8d4" />
                <stop offset="100%" stop-color="#fcd34d" />
              </linearGradient>
            </defs>
            <rect width="900" height="700" fill="url(#g)" />
            <circle cx="220" cy="210" r="140" fill="rgba(255,255,255,.25)" />
            <circle cx="670" cy="440" r="180" fill="rgba(255,255,255,.18)" />
            <path d="M0,530 C220,430 360,610 530,530 S820,420 900,470 L900,700 L0,700 Z" fill="rgba(255,255,255,.28)" />
            <rect x="140" y="160" width="640" height="300" rx="24" fill="rgba(15,23,42,.18)" />
            <text x="450" y="310" font-size="88" font-family="Verdana" text-anchor="middle" fill="#ffffff" font-weight="700">PUZZLE</text>
          </svg>
        `;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      function openPuzzleApp() {
        puzzleWindow.classList.add("show");
      }

      function closePuzzleApp() {
        puzzleWindow.classList.remove("show");
      }

      function minimizePuzzleApp() {
        puzzleWindow.classList.toggle("show");
      }

      openPuzzleBtn.addEventListener("click", openPuzzleApp);
      puzzleCloseBtn.addEventListener("click", closePuzzleApp);
      puzzleMinimizeBtn.addEventListener("click", minimizePuzzleApp);

      puzzleTitlebar.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".puzzle-dot")) return;
        puzzleDrag = true;
        const rect = puzzleWindow.getBoundingClientRect();
        puzzleDragOffsetX = e.clientX - rect.left;
        puzzleDragOffsetY = e.clientY - rect.top;
        puzzleTitlebar.setPointerCapture(e.pointerId);
      });

      puzzleTitlebar.addEventListener("pointermove", (e) => {
        if (!puzzleDrag) return;
        const x = e.clientX - puzzleDragOffsetX;
        const y = e.clientY - puzzleDragOffsetY;
        puzzleWindow.style.left = `${x}px`;
        puzzleWindow.style.top = `${y}px`;
        puzzleWindow.style.transform = "none";
      });

      puzzleTitlebar.addEventListener("pointerup", () => { puzzleDrag = false; });
      puzzleTitlebar.addEventListener("pointercancel", () => { puzzleDrag = false; });

      function renderPuzzle() {
        puzzleBoard.innerHTML = "";
        puzzlePieces = [];
        const boardWidth = puzzleBoard.clientWidth;
        const boardHeight = puzzleBoard.clientHeight;
        const pieceW = boardWidth / puzzleCols;
        const pieceH = boardHeight / puzzleRows;

        for (let row = 0; row < puzzleRows; row++) {
          for (let col = 0; col < puzzleCols; col++) {
            const piece = document.createElement("div");
            piece.className = "puzzle-piece";
            piece.dataset.row = row;
            piece.dataset.col = col;

            const targetX = col * pieceW;
            const targetY = row * pieceH;

            piece.style.width = `${pieceW}px`;
            piece.style.height = `${pieceH}px`;
            piece.style.backgroundImage = `url("${currentImage}")`;
            piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
            piece.style.backgroundPosition = `${-col * pieceW}px ${-row * pieceH}px`;
            piece.dataset.targetX = String(targetX);
            piece.dataset.targetY = String(targetY);

            const randomX = Math.random() * (boardWidth - pieceW);
            const randomY = Math.random() * (boardHeight - pieceH);

            piece.style.left = `${randomX}px`;
            piece.style.top = `${randomY}px`;

            piece.addEventListener("pointerdown", startPieceDrag);
            puzzleBoard.appendChild(piece);
            puzzlePieces.push(piece);
          }
        }
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function startPieceDrag(e) {
        const piece = e.currentTarget;
        draggedPiece = piece;
        piece.classList.add("dragging");
        piece.setPointerCapture(e.pointerId);

        const rect = piece.getBoundingClientRect();
        const boardRect = puzzleBoard.getBoundingClientRect();

        const offsetX = e.clientX - rect.left;
        const offsetY = e.clientY - rect.top;

        piece.dataset.offsetX = String(offsetX);
        piece.dataset.offsetY = String(offsetY);
        piece.dataset.startLeft = String(piece.offsetLeft);
        piece.dataset.startTop = String(piece.offsetTop);

        piece.addEventListener("pointermove", movePieceDrag);
        piece.addEventListener("pointerup", endPieceDrag);
        piece.addEventListener("pointercancel", endPieceDrag);
      }

      function movePieceDrag(e) {
        if (!draggedPiece) return;

        const boardRect = puzzleBoard.getBoundingClientRect();
        const piece = draggedPiece;
        const offsetX = Number(piece.dataset.offsetX);
        const offsetY = Number(piece.dataset.offsetY);

        const maxX = boardRect.width - piece.offsetWidth;
        const maxY = boardRect.height - piece.offsetHeight;

        let x = e.clientX - boardRect.left - offsetX;
        let y = e.clientY - boardRect.top - offsetY;

        x = clamp(x, 0, maxX);
        y = clamp(y, 0, maxY);

        piece.style.left = `${x}px`;
        piece.style.top = `${y}px`;
      }

      function endPieceDrag(e) {
        if (!draggedPiece) return;

        const piece = draggedPiece;
        const targetX = Number(piece.dataset.targetX);
        const targetY = Number(piece.dataset.targetY);
        const currentX = parseFloat(piece.style.left);
        const currentY = parseFloat(piece.style.top);

        const distance = Math.hypot(currentX - targetX, currentY - targetY);

        if (distance < 35) {
          piece.style.left = `${targetX}px`;
          piece.style.top = `${targetY}px`;
          piece.classList.add("locked");
        }

        piece.classList.remove("dragging");
        piece.removeEventListener("pointermove", movePieceDrag);
        piece.removeEventListener("pointerup", endPieceDrag);
        piece.removeEventListener("pointercancel", endPieceDrag);

        draggedPiece = null;
        checkPuzzleSolved();
      }

      function checkPuzzleSolved() {
        const allLocked = puzzlePieces.every((piece) => piece.classList.contains("locked"));
        if (allLocked) {
          puzzleStatus.textContent = "Solved!";
        } else {
          puzzleStatus.textContent = "Drag pieces to solve";
        }
      }

      function shufflePuzzle() {
        const boardWidth = puzzleBoard.clientWidth;
        const boardHeight = puzzleBoard.clientHeight;

        puzzlePieces.forEach((piece) => {
          const pieceW = piece.offsetWidth;
          const pieceH = piece.offsetHeight;
          const randomX = Math.random() * (boardWidth - pieceW);
          const randomY = Math.random() * (boardHeight - pieceH);

          piece.style.left = `${randomX}px`;
          piece.style.top = `${randomY}px`;
          piece.classList.remove("locked");
        });

        puzzleStatus.textContent = "Drag pieces to solve";
      }

      function resetPuzzle() {
        puzzlePieces.forEach((piece) => {
          piece.style.left = `${piece.dataset.targetX}px`;
          piece.style.top = `${piece.dataset.targetY}px`;
          piece.classList.remove("locked");
        });

        puzzleStatus.textContent = "Drag pieces to solve";
      }

      function onUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          currentImage = e.target.result;
          renderPuzzle();
          shufflePuzzle();
        };
        reader.readAsDataURL(file);}
      shufflePuzzleBtn.addEventListener("click", shufflePuzzle);
      resetPuzzleBtn.addEventListener("click", resetPuzzle);
      puzzleUpload.addEventListener("change", onUpload);
      const resizeObserver = new ResizeObserver(() => {
        renderPuzzle();
        shufflePuzzle();});
      resizeObserver.observe(puzzleBoard);
      renderPuzzle();
      shufflePuzzle();
    </script>
